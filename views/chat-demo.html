<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket Chat Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/chat-demo.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>

<body>
    <main class="content">
        <div class="container p-0">
            <h1 class="h3 mb-3">Messages</h1>

            <div class="card">
                <div class="row g-0">
                    <div class="col-12" x-data="chatBox()">
                        <div class="py-2 px-4 border-bottom d-none d-lg-block">
                            <div class="d-flex align-items-center py-1">
                                <div class="position-relative">
                                    <img src="https://bootdey.com/img/Content/avatar/avatar3.png"
                                        class="rounded-circle mr-1" :alt="$store.user.id" width="40" height="40" />
                                </div>
                                <div class="flex-grow-1 pl-3">
                                    <strong x-text="$store.user.id"></strong>
                                    <div class="text-muted small">
                                        <span
                                            x-text="$store.user?.online ? ($store.user?.typing ? 'Typing...' : 'Online') : 'Offline'"></span>
                                    </div>
                                </div>
                                <div>
                                    <button class="btn btn-primary btn-lg mr-1 px-3">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                            stroke-linecap="round" stroke-linejoin="round"
                                            class="feather feather-phone feather-lg">
                                            <path
                                                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                                            </path>
                                        </svg>
                                    </button>
                                    <button class="btn btn-info btn-lg mr-1 px-3 d-none d-md-inline-block">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                            stroke-linecap="round" stroke-linejoin="round"
                                            class="feather feather-video feather-lg">
                                            <polygon points="23 7 16 12 23 17 23 7"></polygon>
                                            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                                        </svg>
                                    </button>
                                    <button class="btn btn-light border btn-lg px-3">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                            stroke-linecap="round" stroke-linejoin="round"
                                            class="feather feather-more-horizontal feather-lg">
                                            <circle cx="12" cy="12" r="1"></circle>
                                            <circle cx="19" cy="12" r="1"></circle>
                                            <circle cx="5" cy="12" r="1"></circle>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="position-relative">
                            <div class="chat-messages p-4">
                                <template x-for="message in $store.user.messages">
                                    <div class="pb-4"
                                        x-bind:class="message.sender == $store.user.id ? 'chat-message-left' : 'chat-message-right'">
                                        <div>
                                            <img src="https://bootdey.com/img/Content/avatar/avatar1.png"
                                                class="rounded-circle mr-1" alt="Chris Wood" width="40" height="40" />
                                            <div class="text-muted small text-nowrap mt-2">
                                                2:33 am
                                            </div>
                                        </div>
                                        <div class="flex-shrink-1 bg-light rounded py-2 px-3 mr-3">
                                            <div class="font-weight-bold mb-1"
                                                x-text="$store.user.id == message.sender ? $store.user.id : 'You'">
                                            </div>
                                            <span x-text="message.message"></span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="flex-grow-0 py-3 px-4 border-top">
                            <div class="input-group">
                                <input type="text" class="form-control mr-3" placeholder="Type your message"
                                    x-model="content" @keyup.enter="privateMessage" />
                                <button class="btn btn-primary" id="send-message-btn"
                                    @click.debounce="privateMessage">Send</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.3.2/socket.io.js"></script>
    <script>
        let socket, from, to = null;

        function chatBox() {
            return {
                content: '',
                privateMessage() {
                    socket.emit('private message', { content: this.content, from, to })
                    this.content = ''
                }
            }
        }

        document.addEventListener('alpine:init', () => {
            Alpine.store('user', {
                id: 0,
                messages: [],
                online: false,
                typing: false,
            });
            Alpine.effect(() => { console.log(Alpine.store('user'), 'Changed') })
        });

        document.addEventListener('DOMContentLoaded', () => {
            from = prompt('Select user 1:');
            to = prompt('Select user 2:');

            Alpine.store('user').id = to

            socket = io({ transports: ['websocket'], autoConnect: false });
            socket.auth = { userId: from };
            socket.connect();

            socket.on('connect', () => {
                socket.emit('check opponent user online status', { userId: to }, ({ online }) => {
                    Alpine.store('user').online = online;
                })
            });

            socket.on('user connected', ({ userId }) => {
                if (Alpine.store('user').id == userId) {
                    Alpine.store('user').online = true
                }
            });

            socket.on('user disconnected', ({ userId }) => {
                if (Alpine.store('user').id == userId) {
                    Alpine.store('user').online = false
                }
            });

            socket.on('private message', (data) => {
                Alpine.store('user').messages.push(data)
                console.log(data, 'new message')
            });

            socket.on('disconnect', () => {
                Alpine.store('user').online = false;
                socket.connect()
            });

            socket.onAny((event, ...args) => {
                console.log(event, args);
            });
        });
    </script>
</body>

</html>
